<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<title>LB System</title>
<meta name="theme-color" content="#0B120E">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="LB System">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{background:#0B120E;-webkit-text-size-adjust:100%}
body{overscroll-behavior-y:none}
button{background:none;border:none;color:inherit;font:inherit;cursor:pointer;text-align:inherit}
input,textarea{font:inherit;outline:none;-webkit-appearance:none}
input[type=range]{-webkit-appearance:none;background:transparent}
input[type=range]::-webkit-slider-runnable-track{height:4px;background:#22362B;border-radius:2px}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:20px;height:20px;border-radius:50%;background:#E14434;margin-top:-8px}
input[type=range]::-moz-range-track{height:4px;background:#22362B;border-radius:2px}
input[type=range]::-moz-range-thumb{width:20px;height:20px;border:none;border-radius:50%;background:#E14434}
svg{display:inline-block;vertical-align:middle}

.flex{display:flex}
.grid{display:grid}
.flex-1{flex:1 1 0%}
.flex-col{flex-direction:column}
.flex-wrap{flex-wrap:wrap}
.items-center{align-items:center}
.items-start{align-items:flex-start}
.items-baseline{align-items:baseline}
.justify-between{justify-content:space-between}
.justify-center{justify-content:center}
.grid-cols-2{grid-template-columns:repeat(2,minmax(0,1fr))}
.grid-cols-3{grid-template-columns:repeat(3,minmax(0,1fr))}
.grid-cols-4{grid-template-columns:repeat(4,minmax(0,1fr))}
.gap-1{gap:.25rem}.gap-1\.5{gap:.375rem}.gap-2{gap:.5rem}.gap-3{gap:.75rem}.gap-4{gap:1rem}

.w-full{width:100%}
.min-h-screen{min-height:100vh}
.overflow-hidden{overflow:hidden}
.text-center{text-align:center}
.text-left{text-align:left}
.text-right{text-align:right}
.rounded{border-radius:.375rem}
.rounded-lg{border-radius:.5rem}
.rounded-full{border-radius:9999px}

.sticky{position:sticky}
.fixed{position:fixed}
.top-0{top:0}.bottom-0{bottom:0}.left-0{left:0}.right-0{right:0}
.left-4{left:1rem}.right-4{right:1rem}
.z-20{z-index:20}

.p-2{padding:.5rem}.p-3{padding:.75rem}.p-4{padding:1rem}
.px-2{padding-left:.5rem;padding-right:.5rem}
.px-4{padding-left:1rem;padding-right:1rem}
.py-1{padding-top:.25rem;padding-bottom:.25rem}
.py-1\.5{padding-top:.375rem;padding-bottom:.375rem}
.py-2{padding-top:.5rem;padding-bottom:.5rem}
.py-3{padding-top:.75rem;padding-bottom:.75rem}
.pt-4{padding-top:1rem}
.pb-3{padding-bottom:.75rem}
.mb-1{margin-bottom:.25rem}.mb-2{margin-bottom:.5rem}.mb-3{margin-bottom:.75rem}.mb-4{margin-bottom:1rem}
.mt-0\.5{margin-top:.125rem}.mt-1{margin-top:.25rem}.mt-2{margin-top:.5rem}.mt-3{margin-top:.75rem}

.active\:scale-95:active{transform:scale(.95)}
.animate-spin{animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

</style>
</head>
<body>
<div id="root"></div>
